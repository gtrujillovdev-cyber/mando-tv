<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mando Universal TV - Vintage Edition</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      background-color: #0b0e14 !important;
      color: #e2e8f0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    }

    /* CHASIS RETRO DE ALTA FIDELIDAD */
    .retro-chassis {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(var(--sat), 6px);
      padding-bottom: max(var(--sab), 8px);
      padding-left: 10px;
      padding-right: 10px;
      background: linear-gradient(180deg, #161c28 0%, #0d111a 40%, #07090f 100%);
      box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.9);
    }

    /* PANTALLA LCD RETRO DE FÓSFORO */
    .retro-lcd {
      background: #041009;
      border: 1.5px solid #163820;
      border-radius: 10px;
      box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 255, 255, 0.08);
      font-family: ui-monospace, "SF Mono", "Courier New", monospace;
      color: #34d399;
      text-shadow: 0 0 6px rgba(52, 211, 153, 0.6);
    }

    /* BOTONES TÁCTILES ESTILO TECLADO RETRO BRAUN / SONY */
    .btn-retro {
      background: linear-gradient(180deg, #283042 0%, #1a202d 65%, #131722 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      border-right: 1px solid rgba(0, 0, 0, 0.6);
      border-bottom: 2px solid #090c12;
      box-shadow: 0 3px 6px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      transition: all 0.04s ease;
      touch-action: manipulation;
    }
    .btn-retro:active {
      transform: translateY(2px);
      border-bottom-width: 1px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(0, 0, 0, 0.8);
      filter: brightness(1.25);
    }

    /* BOTÓN ENCENDIDO (VERDE VINTAGE) */
    .btn-power-on {
      background: linear-gradient(180deg, #10b981 0%, #059669 65%, #047857 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-bottom: 2px solid #064e3b;
      box-shadow: 0 3px 8px rgba(16, 185, 129, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-power-on:active { transform: translateY(2px); filter: brightness(1.3); }

    /* BOTÓN APAGADO (ROJO VINTAGE) */
    .btn-power-off {
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 65%, #be123c 100%);
      border-top: 1px solid rgba(255, 255, 255, 0.4);
      border-bottom: 2px solid #881337;
      box-shadow: 0 3px 8px rgba(225, 29, 72, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }
    .btn-power-off:active { transform: translateY(2px); filter: brightness(1.3); }

    /* CONMUTADOR SELECTOR DE TV (CONCENTRIC TOGGLE) */
    .retro-selector-bar {
      background: #090c13;
      border: 1px solid #1e2637;
      border-radius: 12px;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.8);
    }
    .retro-tab {
      color: #94a3b8;
      transition: all 0.15s ease;
    }
    .retro-tab.active {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      color: #ffffff;
      font-weight: 800;
      border-radius: 9px;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.3);
    }

    /* SLIDERS TIPO MESA DE MEZCLAS RETRO */
    input[type=range] {
      -webkit-appearance: none;
      height: 5px;
      border-radius: 2px;
      background: #090d15;
      border: 1px solid #1a2232;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 4px;
      background: linear-gradient(180deg, #64748b 0%, #334155 100%);
      border-top: 1px solid #94a3b8;
      border-bottom: 2px solid #0f172a;
      box-shadow: 0 2px 5px rgba(0,0,0,0.8);
      cursor: pointer;
    }
    .slider-vol::-webkit-slider-thumb {
      background: linear-gradient(180deg, #a855f7 0%, #7e22ce 100%);
      border-top: 1px solid #d8b4fe;
      box-shadow: 0 2px 6px rgba(168, 85, 247, 0.6);
    }

    /* CRUCETA D-PAD RETRO SONY / HI-FI */
    .retro-dpad-bezel {
      position: relative;
      width: 204px;
      height: 204px;
      border-radius: 9999px;
      background: radial-gradient(circle at 50% 50%, #1c2333 0%, #121724 60%, #0a0d15 100%);
      border: 2px solid #232d42;
      box-shadow: 
        0 10px 24px rgba(0, 0, 0, 0.9),
        inset 0 2px 3px rgba(255, 255, 255, 0.12),
        inset 0 -3px 8px rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dpad-key {
      position: absolute;
      background: linear-gradient(180deg, #2a3348 0%, #181d29 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #cbd5e1;
      font-size: 17px;
      font-weight: 900;
      transition: all 0.04s ease;
      touch-action: manipulation;
    }
    .dpad-key:active {
      background: #1d4ed8;
      color: #ffffff;
      border-color: #3b82f6;
      transform: scale(0.93);
    }
    .dpad-k-up {
      top: 6px;
      width: 78px;
      height: 54px;
      border-radius: 26px 26px 8px 8px;
    }
    .dpad-k-down {
      bottom: 6px;
      width: 78px;
      height: 54px;
      border-radius: 8px 8px 26px 26px;
    }
    .dpad-k-left {
      left: 6px;
      width: 54px;
      height: 78px;
      border-radius: 26px 8px 8px 26px;
    }
    .dpad-k-right {
      right: 6px;
      width: 54px;
      height: 78px;
      border-radius: 8px 26px 26px 8px;
    }
    .dpad-k-center {
      z-index: 10;
      width: 72px;
      height: 72px;
      border-radius: 9999px;
      font-size: 15px;
      font-weight: 900;
      color: #ffffff;
      background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #1d4ed8 70%, #172554 100%);
      box-shadow: 
        0 4px 12px rgba(29, 78, 216, 0.7),
        inset 0 2px 2px rgba(255, 255, 255, 0.4),
        inset 0 -2px 5px rgba(0, 0, 0, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-k-center:active {
      transform: scale(0.92);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.95);
      background: #1e40af;
    }

    /* MÓDULOS VERTICALES ROCKER (VOLUMEN Y CANALES) */
    .retro-rocker-mod {
      width: 66px;
      height: 204px;
      background: #0e121a;
      border: 1px solid #1e2637;
      border-radius: 24px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8), 0 4px 12px rgba(0, 0, 0, 0.5);
      flex-shrink: 0;
    }
    .rocker-btn {
      width: 100%;
      flex: 1;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      font-weight: 900;
      color: #f1f5f9;
      transition: all 0.04s ease;
    }
    .rocker-sep-btn {
      width: 100%;
      height: 36px;
      margin: 4px 0;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 900;
    }

    /* PILLS DE STREAMING */
    .plat-tab {
      background: #111622;
      border: 1px solid #1f2738;
      color: #94a3b8;
    }
    .plat-tab.active-p {
      background: #3b82f6 !important;
      color: #ffffff !important;
      border-color: #60a5fa !important;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.6);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

<div class="retro-chassis">

  <!-- 1. PANTALLA LCD RETRO DE ESTADO SUPERIOR (7-SEGMENT PHOSPHOR GLOW) -->
  <div class="retro-lcd px-2.5 py-1 flex items-center justify-between text-[10px] tracking-wider flex-shrink-0">
    <div class="flex items-center gap-2">
      <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="lcdTarget" class="font-bold text-emerald-300">TV: XIAOMI</span>
      <span class="text-emerald-700">|</span>
      <span id="lcdAudio" class="text-emerald-400">ARC: SHARP</span>
    </div>
    <div class="flex items-center gap-2">
      <!-- Indicador digital de sueño (sin solapamientos ni desbordes) -->
      <span id="lcdTimer" onclick="confirmarCancelarTimer()" class="font-bold cursor-pointer text-emerald-300">⏱ SLEEP: OFF</span>
    </div>
  </div>

  <!-- 2. CABECERA: PWR ON | SELECTOR MULTI-TV TIPO TOGGLE | PWR OFF -->
  <div class="flex items-center justify-between gap-1.5 flex-shrink-0">
    <button onclick="solicitarEncendido()" title="Encender TV" class="btn-power-on px-3.5 h-9 rounded-xl text-white flex items-center justify-center gap-1 font-black text-xs active:scale-95 transition-transform shadow">
      <span>⚡</span> <span>ON</span>
    </button>

    <div class="flex-1 flex retro-selector-bar p-1 gap-1">
      <button onclick="setDispositivo('xiaomi')" id="tab-xiaomi" class="retro-tab active flex-1 py-1.5 text-[11px] font-bold">
        Xiaomi
      </button>
      <button onclick="setDispositivo('lg')" id="tab-lg" class="retro-tab flex-1 py-1.5 text-[11px] font-bold">
        LG 65"
      </button>
      <button onclick="setDispositivo('ambas')" id="tab-ambas" class="retro-tab flex-1 py-1.5 text-[11px] font-bold">
        Ambas
      </button>
    </div>

    <button onclick="solicitarApagado()" title="Apagar TV" class="btn-power-off px-3.5 h-9 rounded-xl text-white flex items-center justify-center gap-1 font-black text-xs active:scale-95 transition-transform shadow">
      <span>⏻</span> <span>OFF</span>
    </button>
  </div>

  <!-- 3. SELECTOR DE FUENTES STREAMING & BARRA DE COMANDO -->
  <div class="w-full flex-shrink-0 space-y-1">
    <div class="flex items-center gap-1 overflow-x-auto py-0.5 no-scrollbar">
      <button type="button" onclick="setPlataforma('smarttube')" id="plat-smarttube" class="plat-tab active-p px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1">
        📺 SmartTube
      </button>
      <button type="button" onclick="setPlataforma('netflix')" id="plat-netflix" class="plat-tab px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1 text-rose-300">
        🍿 Netflix
      </button>
      <button type="button" onclick="setPlataforma('prime')" id="plat-prime" class="plat-tab px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1 text-sky-300">
        📦 Prime
      </button>
      <button type="button" onclick="setPlataforma('disney')" id="plat-disney" class="plat-tab px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1 text-indigo-300">
        ✨ Disney+
      </button>
      <button type="button" onclick="setPlataforma('spotify')" id="plat-spotify" class="plat-tab px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1 text-emerald-300">
        🎵 Spotify
      </button>
      <button type="button" onclick="setPlataforma('youtube')" id="plat-youtube" class="plat-tab px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1 text-red-300">
        ▶️ YouTube
      </button>
    </div>

    <form onsubmit="buscarYReproducir(event)" class="relative flex items-center">
      <input 
        id="inputBusqueda" 
        type="search" 
        enterkeyhint="search" 
        autocomplete="off"
        spellcheck="false"
        placeholder="🔍 Buscar o dictar en SmartTube..." 
        class="w-full bg-[#0a0e16] border border-slate-700/60 focus:border-blue-500 text-slate-100 placeholder-slate-500 text-xs rounded-xl pl-3 pr-12 py-1.5 shadow-inner focus:outline-none focus:ring-1 focus:ring-blue-500 font-mono"
      />
      <button type="submit" class="absolute right-1 px-3 py-1 bg-blue-600 active:bg-blue-700 text-white rounded-lg text-xs font-bold shadow">
        Ir
      </button>
    </form>
  </div>

  <!-- 4. CONTROLES ANALÓGICOS RETRO: BRIGHTNESS & VOLUME FADERS -->
  <div class="bg-[#0b0f17] border border-slate-800 p-2.5 rounded-xl space-y-1.5 flex-shrink-0 shadow-inner">
    <div>
      <div class="flex justify-between items-center text-[9px] font-mono tracking-widest text-slate-400 mb-0.5">
        <span>☀️ RETROILUMINACIÓN</span>
        <span id="brilloVal" class="text-sky-400 font-bold">6%</span>
      </div>
      <input id="sliderBrillo" type="range" min="0" max="100" value="6" oninput="actualizarLabelBrillo(this.value)" onchange="enviarBrillo(this.value)" class="w-full">
    </div>
    <div>
      <div class="flex justify-between items-center text-[9px] font-mono tracking-widest text-slate-400 mb-0.5">
        <span>🔊 VOLUMEN MAESTRO</span>
        <span id="volVal" class="text-purple-400 font-bold">15%</span>
      </div>
      <input id="sliderVol" type="range" min="0" max="100" value="15" oninput="actualizarLabelVol(this.value)" onchange="enviarVolumen(this.value)" class="w-full slider-vol">
    </div>
  </div>

  <!-- 5. PRESETS CIRCADIANOS: DÍA Y NOCHE LIMPIOS (SIN OVERFLOWS NI BADGES SOLAPADOS) -->
  <div class="grid grid-cols-4 gap-1.5 flex-shrink-0">
    <!-- Noche (Brillo 6% + Timer 90m de fábrica) -->
    <button onclick="enviarAccion('noche')" id="btnNoche" title="Modo Noche (6% Brillo + 90 min de autoapagado)" class="btn-retro py-2 px-1 rounded-xl text-center border-l-2 border-indigo-400">
      <div class="text-xs">🌙</div>
      <div class="text-[10px] font-black text-white leading-tight">Noche</div>
      <div class="text-[8px] font-mono text-indigo-300">6% • 90m</div>
    </button>

    <!-- Día (100% Brillo) -->
    <button onclick="enviarAccion('dia')" title="Modo Día (100% Brillo)" class="btn-retro py-2 px-1 rounded-xl text-center border-l-2 border-amber-400">
      <div class="text-xs">☀️</div>
      <div class="text-[10px] font-black text-white leading-tight">Día</div>
      <div class="text-[8px] font-mono text-amber-300">100%</div>
    </button>

    <!-- Cine (Filmmaker 30%) -->
    <button onclick="enviarAccion('cine')" title="Modo Cine" class="btn-retro py-2 px-1 rounded-xl text-center border-l-2 border-slate-500">
      <div class="text-xs">🎬</div>
      <div class="text-[10px] font-black text-white leading-tight">Cine</div>
      <div class="text-[8px] font-mono text-slate-400">30%</div>
    </button>

    <!-- Juego (Low Latency) -->
    <button onclick="enviarAccion('juego')" title="Modo Juego" class="btn-retro py-2 px-1 rounded-xl text-center border-l-2 border-emerald-500">
      <div class="text-xs">🎮</div>
      <div class="text-[10px] font-black text-white leading-tight">Juego</div>
      <div class="text-[8px] font-mono text-emerald-400">9ms</div>
    </button>
  </div>

  <!-- 6. CONSOLA CENTRAL HI-FI: ROCKER VOL + CRUCETA D-PAD GIGANTE + ROCKER CH -->
  <div class="flex items-center justify-between gap-2 flex-shrink-0 my-1">
    
    <!-- Rocker Volumen Clásico -->
    <div class="retro-rocker-mod">
      <button onclick="enviarAccion('vol_up')" title="Volumen +" class="btn-retro rocker-btn">
        <span>+</span>
        <span class="text-[8px] font-mono text-slate-400">VOL</span>
      </button>
      <button onclick="enviarAccion('mute')" title="Silenciar / Mute" class="btn-retro rocker-sep-btn text-amber-400">
        🔇
      </button>
      <button onclick="enviarAccion('vol_down')" title="Volumen -" class="btn-retro rocker-btn">
        <span class="text-[8px] font-mono text-slate-400">VOL</span>
        <span>-</span>
      </button>
    </div>

    <!-- Cruceta D-Pad Circular Retro (204px) -->
    <div class="retro-dpad-bezel mx-auto">
      <button onclick="enviarAccion('up')" title="Arriba" class="dpad-key dpad-k-up">▲</button>
      <button onclick="enviarAccion('down')" title="Abajo" class="dpad-key dpad-k-down">▼</button>
      <button onclick="enviarAccion('left')" title="Izquierda" class="dpad-key dpad-k-left">◄</button>
      <button onclick="enviarAccion('right')" title="Derecha" class="dpad-key dpad-k-right">►</button>
      <button onclick="enviarAccion('enter')" title="Aceptar / OK" class="dpad-k-center">OK</button>
    </div>

    <!-- Rocker Canales y HDMI -->
    <div class="retro-rocker-mod">
      <button onclick="enviarAccion('ch_up')" title="Canal +" class="btn-retro rocker-btn">
        <span>+</span>
        <span class="text-[8px] font-mono text-slate-400">CH</span>
      </button>
      <button onclick="enviarAccion('source')" title="Entrada / HDMI" class="btn-retro rocker-sep-btn text-sky-400 font-mono text-[9px]">
        HDMI
      </button>
      <button onclick="enviarAccion('ch_down')" title="Canal -" class="btn-retro rocker-btn">
        <span class="text-[8px] font-mono text-slate-400">CH</span>
        <span>-</span>
      </button>
    </div>
  </div>

  <!-- 7. BOTONERA DE TRANSPORTE MULTIMEDIA TIPO CASSETTE / VCR (Grandes y Cómodos) -->
  <div class="grid grid-cols-5 gap-2 flex-shrink-0">
    <button onclick="enviarAccion('back')" title="Atrás" class="btn-retro h-12 rounded-xl flex items-center justify-center text-slate-200 font-black text-lg">
      <span>↩</span>
    </button>
    <button onclick="enviarAccion('rewind')" title="Rebobinar -10s" class="btn-retro h-12 rounded-xl flex items-center justify-center text-slate-200 font-black text-lg">
      <span>⏪</span>
    </button>
    <button onclick="enviarAccion('play_pause')" title="Play / Pausa" class="btn-retro h-12 rounded-xl text-white bg-gradient-to-b from-indigo-600 to-indigo-800 border-indigo-400/50 flex items-center justify-center text-xl shadow-lg">
      ⏯️
    </button>
    <button onclick="enviarAccion('fast_forward')" title="Avanzar +10s" class="btn-retro h-12 rounded-xl flex items-center justify-center text-slate-200 font-black text-lg">
      <span>⏩</span>
    </button>
    <button onclick="enviarAccion('home')" title="Inicio (Home)" class="btn-retro h-12 rounded-xl flex items-center justify-center text-slate-200 font-black text-lg">
      <span>🏠</span>
    </button>
  </div>

  <!-- 8. SISTEMA & CONMUTADOR DE BARRA SHARP VINTAGE -->
  <div class="grid grid-cols-5 gap-2 flex-shrink-0">
    <button onclick="enviarAccion('settings')" title="Ajustes" class="btn-retro h-11 rounded-xl flex flex-col items-center justify-center text-slate-300 font-bold text-[9px]">
      <span class="text-sm">⚙️</span>
      <span class="font-mono">MENU</span>
    </button>
    <button onclick="enviarAccion('info')" title="Información" class="btn-retro h-11 rounded-xl flex flex-col items-center justify-center text-slate-300 font-bold text-[9px]">
      <span class="text-sm">ℹ️</span>
      <span class="font-mono">INFO</span>
    </button>
    <!-- SELECTOR DE SALIDA SHARP ARC -->
    <button id="btnAudioSharp" onclick="conmutarSalidaAudio()" title="Conmutar Barra Sharp ARC / Altavoces TV" class="btn-retro h-11 rounded-xl flex flex-col items-center justify-center text-emerald-400 font-black text-[9px] border-emerald-500/40">
      <span class="text-sm">📢</span>
      <span id="lblAudioOut" class="font-mono tracking-tight">ARC: SHARP</span>
    </button>
    <button onclick="setPlataforma('smarttube'); buscarYReproducir(event);" title="SmartTube" class="btn-retro h-11 rounded-xl flex flex-col items-center justify-center text-red-400 font-bold text-[9px] border-red-500/40">
      <span class="text-sm">📺</span>
      <span class="font-mono">TUBE</span>
    </button>
    <button onclick="enviarAccion('solo_audio')" title="Solo Audio (Pantalla Off)" class="btn-retro h-11 rounded-xl flex flex-col items-center justify-center text-amber-300 font-bold text-[9px] border-amber-500/40">
      <span class="text-sm">📻</span>
      <span class="font-mono">AUDIO</span>
    </button>
  </div>

  <!-- 9. PIE DE PÁGINA RETRO CON ESTADO Y HUB SIRI -->
  <div class="flex items-center justify-between text-[10px] text-slate-500 px-1 border-t border-slate-800/80 pt-1 flex-shrink-0 font-mono">
    <div class="flex items-center gap-1.5">
      <span id="statusTxt" class="text-slate-400 truncate max-w-[210px]">READY // STANDBY OK</span>
    </div>
    <a href="/siri" class="flex items-center gap-1 font-bold text-sky-400 bg-sky-950/40 px-2.5 py-1 rounded-lg border border-sky-800/40 active:scale-95 transition-all">
      <span>🎙️</span> <span>SIRI ATAJOS</span>
    </a>
  </div>

</div>

<script>
  let dispositivoActual = localStorage.getItem('mando_target') || 'xiaomi'; window.addEventListener('DOMContentLoaded', () => setTimeout(() => setDispositivo(dispositivoActual), 0));
  let plataformaActual = 'smarttube';
  let audioEsSharp = true;
  let timerActualMinutos = 0;

  const placeholders = {
    'smarttube': '🔍 Buscar o dictar en SmartTube...',
    'youtube': '▶️ Buscar vídeo en YouTube...',
    'netflix': '🍿 Buscar serie o peli en Netflix...',
    'prime': '📦 Buscar en Prime Video...',
    'disney': '✨ Buscar en Disney+...',
    'spotify': '🎵 Buscar canción o playlist en Spotify...'
  };

  function vibrar() {
    if (navigator.vibrate) navigator.vibrate(25);
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(75, ctx.currentTime);
      gain.gain.setValueAtTime(0.09, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
    } catch(e) {}
  }

  function setDispositivo(target) {
    vibrar();
    dispositivoActual = target; localStorage.setItem('mando_target', target);
    ['xiaomi', 'lg', 'ambas'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (t === target) {
        el.className = 'retro-tab active flex-1 py-1.5 text-[11px] font-bold';
      } else {
        el.className = 'retro-tab flex-1 py-1.5 text-[11px] font-bold';
      }
    });

    const nombreLcd = target === 'ambas' ? 'TV: AMBAS' : (target === 'lg' ? 'TV: LG 65"' : 'TV: XIAOMI');
    document.getElementById('lcdTarget').textContent = nombreLcd;
    actualizarStatus('CONTROL: ' + target.toUpperCase());
    sincronizarEstadoServidor();
  }

  function setPlataforma(plat) {
    vibrar();
    plataformaActual = plat;
    const plats = ['smarttube', 'netflix', 'prime', 'disney', 'spotify', 'youtube'];
    plats.forEach(p => {
      const btn = document.getElementById('plat-' + p);
      if (btn) {
        if (p === plat) {
          btn.className = 'plat-tab active-p px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1';
        } else {
          btn.className = 'plat-tab px-2.5 py-1 rounded-lg text-[9.5px] font-bold whitespace-nowrap flex items-center gap-1 text-slate-400';
        }
      }
    });
    const inp = document.getElementById('inputBusqueda');
    if (inp) {
      inp.placeholder = placeholders[plat] || '🔍 Buscar...';
      inp.value = '';
    }
  }

  async function buscarYReproducir(e) {
    if (e) e.preventDefault();
    vibrar();
    const query = document.getElementById('inputBusqueda').value.trim();
    actualizarStatus('LANZANDO ' + plataformaActual.toUpperCase() + (query ? ': ' + query : '...'));

    try {
      const url = '/api/voice?q=' + encodeURIComponent(query) + '&platform=' + encodeURIComponent(plataformaActual) + '&target=' + encodeURIComponent(dispositivoActual);
      const res = await fetch(url);
      const data = await res.json();
      actualizarStatus(data.mensaje || 'STREAM ENVIADO');
    } catch(err) {
      actualizarStatus('ERR CONEXIÓN');
    }
  }

  async function enviarAccion(cmd, val = '0') {
    vibrar();
    try {
      const url = '/api/action?cmd=' + encodeURIComponent(cmd) + '&target=' + encodeURIComponent(dispositivoActual) + '&val=' + encodeURIComponent(val);
      const res = await fetch(url);
      const data = await res.json();
      if (data.ok && data.mensaje) {
        actualizarStatus(data.mensaje);
      }
      setTimeout(sincronizarEstadoServidor, 600);
    } catch(e) {
      actualizarStatus('ERR TRANSMISIÓN');
    }
  }

  function conmutarSalidaAudio() {
    vibrar();
    audioEsSharp = !audioEsSharp;
    const cmd = audioEsSharp ? 'audio_sharp' : 'audio_tv';
    const label = audioEsSharp ? 'ARC: SHARP' : 'SPK: TV';
    const lcdTxt = audioEsSharp ? 'ARC: SHARP' : 'SPK: TV';
    document.getElementById('lblAudioOut').textContent = label;
    document.getElementById('lcdAudio').textContent = lcdTxt;
    enviarAccion(cmd);
    actualizarStatus(audioEsSharp ? 'AUDIO: BARRA SHARP (HDMI ARC)' : 'AUDIO: ALTAVOCES TV');
  }

  function actualizarLabelBrillo(v) {
    document.getElementById('brilloVal').textContent = v + '%';
  }
  function enviarBrillo(v) {
    enviarAccion('set_brillo', v);
  }

  function actualizarLabelVol(v) {
    document.getElementById('volVal').textContent = v + '%';
  }
  function enviarVolumen(v) {
    enviarAccion('set_volumen', v);
  }

  function solicitarEncendido() {
    vibrar();
    enviarAccion('encender');
    actualizarStatus('ENCENDIENDO ' + dispositivoActual.toUpperCase());
  }

  function solicitarApagado() {
    vibrar();
    if (confirm('¿Poner en Standby / Apagar ' + dispositivoActual.toUpperCase() + '?')) {
      enviarAccion('apagar');
      actualizarStatus('STANDBY / APAGANDO...');
    }
  }

  function confirmarCancelarTimer() {
    if (timerActualMinutos <= 0) return;
    vibrar();
    if (confirm('¿Cancelar temporizador de apagado de ' + timerActualMinutos + ' min?')) {
      enviarAccion('cancelar_timer');
      actualizarStatus('TEMPORIZADOR CANCELADO');
      document.getElementById('lcdTimer').textContent = '⏱ SLEEP: OFF';
      timerActualMinutos = 0;
    }
  }

  async function sincronizarEstadoServidor() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      
      let minRest = 0;
      if (dispositivoActual === 'lg') minRest = data.timer_lg;
      else if (dispositivoActual === 'xiaomi') minRest = data.timer_xiaomi;
      else minRest = Math.max(data.timer_lg, data.timer_xiaomi);

      timerActualMinutos = minRest;
      const lcdTimer = document.getElementById('lcdTimer');
      if (minRest > 0) {
        lcdTimer.textContent = '⏱ SLEEP: ' + minRest + 'm';
        lcdTimer.className = 'font-bold cursor-pointer text-amber-300 animate-pulse';
      } else {
        lcdTimer.textContent = '⏱ SLEEP: OFF';
        lcdTimer.className = 'font-bold cursor-pointer text-emerald-400';
      }
    } catch(e) {}
  }

  setInterval(sincronizarEstadoServidor, 4000);
  sincronizarEstadoServidor();

  function actualizarStatus(txt) {
    document.getElementById('statusTxt').textContent = txt.toUpperCase();
  }
</script>
</body>
</html>
