<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#07090e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Mando Universal TV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    html, body {
      background-color: #07090e !important;
      color: #e2e8f0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-overscroll-behavior: none;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .remote-container {
      width: 100%;
      height: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: max(var(--sat), 6px);
      padding-bottom: max(var(--sab), 8px);
      padding-left: 10px;
      padding-right: 10px;
      background: radial-gradient(circle at 50% 15%, #131a2c 0%, #07090e 75%);
    }

    .glass-card {
      background: rgba(18, 24, 38, 0.78);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .btn-key {
      background: linear-gradient(180deg, #242d42 0%, #151a27 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 
        0 2px 5px rgba(0, 0, 0, 0.5),
        inset 0 1px 1px rgba(255, 255, 255, 0.15),
        inset 0 -1px 2px rgba(0, 0, 0, 0.6);
      transition: all 0.04s ease;
      touch-action: manipulation;
    }
    .btn-key:active {
      transform: scale(0.93);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.8), inset 0 2px 4px rgba(0, 0, 0, 0.9);
      filter: brightness(1.35);
    }

    .btn-power-on {
      background: linear-gradient(180deg, #10b981 0%, #047857 70%, #064e3b 100%);
      border: 1px solid rgba(52, 211, 153, 0.7);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.6), inset 0 1px 1px #a7f3d0;
    }
    .btn-power-on:active { transform: scale(0.92); filter: brightness(1.4); }

    .btn-power-off {
      background: linear-gradient(180deg, #ef4444 0%, #b91c1c 70%, #7f1d1d 100%);
      border: 1px solid rgba(248, 113, 113, 0.7);
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.6), inset 0 1px 1px #fecaca;
    }
    .btn-power-off:active { transform: scale(0.92); filter: brightness(1.4); }

    /* D-PAD ERGONÓMICO CON TAMAÑO DEFINIDO */
    .dpad-container {
      position: relative;
      width: 204px;
      height: 204px;
      border-radius: 9999px;
      background: radial-gradient(circle at 50% 50%, #161e31 0%, #101625 60%, #090d16 100%);
      box-shadow: 
        0 10px 28px rgba(0, 0, 0, 0.85),
        inset 0 2px 3px rgba(255, 255, 255, 0.12),
        inset 0 -3px 6px rgba(0, 0, 0, 0.85),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dpad-arrow {
      position: absolute;
      background: linear-gradient(180deg, #242e44 0%, #141a27 100%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f1f5f9;
      font-size: 18px;
      font-weight: 900;
      transition: all 0.05s ease;
      touch-action: manipulation;
    }
    .dpad-arrow:active {
      background: rgba(59, 130, 246, 0.4);
      border-color: #3b82f6;
      color: #93c5fd;
      transform: scale(0.93);
    }
    .dpad-up {
      top: 6px;
      width: 78px;
      height: 54px;
      border-radius: 26px 26px 10px 10px;
    }
    .dpad-down {
      bottom: 6px;
      width: 78px;
      height: 54px;
      border-radius: 10px 10px 26px 26px;
    }
    .dpad-left {
      left: 6px;
      width: 54px;
      height: 78px;
      border-radius: 26px 10px 10px 26px;
    }
    .dpad-right {
      right: 6px;
      width: 54px;
      height: 78px;
      border-radius: 10px 26px 26px 10px;
    }
    .dpad-center {
      z-index: 10;
      width: 72px;
      height: 72px;
      border-radius: 9999px;
      font-size: 16px;
      font-weight: 900;
      color: #ffffff;
      background: radial-gradient(circle at 35% 35%, #3b82f6 0%, #1d4ed8 70%, #1e40af 100%);
      box-shadow: 
        0 4px 14px rgba(29, 78, 216, 0.65),
        inset 0 2px 2px rgba(255, 255, 255, 0.45),
        inset 0 -2px 4px rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .dpad-center:active {
      transform: scale(0.92);
      box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.9);
      background: #1d4ed8;
    }

    /* ROCKERS CLÁSICOS DE VOLUMEN Y CANAL */
    .rocker-box {
      width: 66px;
      height: 204px;
      border-radius: 24px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }
    .rocker-btn {
      width: 100%;
      flex: 1;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: 900;
      color: #f1f5f9;
      transition: all 0.05s ease;
    }
    .rocker-mid-btn {
      width: 100%;
      height: 38px;
      margin: 4px 0;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 800;
    }

    .active-pill {
      background: #3b82f6 !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(59, 130, 246, 0.7);
    }
    .plat-pill {
      background: rgba(18, 24, 38, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .active-plat {
      background: #3b82f6 !important;
      color: #ffffff !important;
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.3) !important;
    }

    /* Sliders personalizados táctiles */
    input[type=range] {
      -webkit-appearance: none;
      height: 6px;
      border-radius: 3px;
      background: #1e293b;
      outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #0284c7;
      cursor: pointer;
    }
    .slider-vol::-webkit-slider-thumb {
      background: #c084fc;
      box-shadow: 0 0 8px #9333ea;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

<div class="remote-container">

  <!-- 1. HEADER: POWER ON / SELECTOR TV / POWER OFF -->
  <div class="flex items-center justify-between gap-1.5 flex-shrink-0">
    <!-- Botón Power ON (Verde Clásico) -->
    <button onclick="solicitarEncendido()" title="Encender TV" class="btn-power-on px-3.5 h-9 rounded-xl text-white flex items-center justify-center gap-1 font-black text-xs active:scale-95 transition-transform shadow-lg">
      <span class="text-sm">⚡</span> <span>ON</span>
    </button>

    <!-- Selector de Dispositivo Activo (Xiaomi, LG, Ambas) -->
    <div class="flex-1 flex bg-[#0e1320] p-1 rounded-xl border border-white/10 gap-1 shadow-inner">
      <button onclick="setDispositivo('xiaomi')" id="tab-xiaomi" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all active-pill">
        Xiaomi
      </button>
      <button onclick="setDispositivo('lg')" id="tab-lg" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition-all">
        LG 65"
      </button>
      <button onclick="setDispositivo('ambas')" id="tab-ambas" class="flex-1 py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition-all">
        Ambas
      </button>
    </div>

    <!-- Botón Power OFF (Rojo Clásico) -->
    <button onclick="solicitarApagado()" title="Apagar TV" class="btn-power-off px-3.5 h-9 rounded-xl text-white flex items-center justify-center gap-1 font-black text-xs active:scale-95 transition-transform shadow-lg">
      <span class="text-sm">⏻</span> <span>OFF</span>
    </button>
  </div>

  <!-- 2. SELECTOR MULTIPLATAFORMA STREAMING & BUSCADOR CON DICTADO iOS -->
  <div class="w-full flex-shrink-0 space-y-1">
    <!-- Selector de Plataforma (Pills horizontales) -->
    <div class="flex items-center gap-1 overflow-x-auto py-0.5 no-scrollbar">
      <button type="button" onclick="setPlataforma('smarttube')" id="plat-smarttube" class="active-plat px-2.5 py-1 rounded-xl text-[10px] font-extrabold flex items-center gap-1 whitespace-nowrap transition-all shadow">
        📺 SmartTube
      </button>
      <button type="button" onclick="setPlataforma('netflix')" id="plat-netflix" class="plat-pill px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 whitespace-nowrap text-rose-300 transition-all">
        🍿 Netflix
      </button>
      <button type="button" onclick="setPlataforma('prime')" id="plat-prime" class="plat-pill px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 whitespace-nowrap text-sky-300 transition-all">
        📦 Prime
      </button>
      <button type="button" onclick="setPlataforma('disney')" id="plat-disney" class="plat-pill px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 whitespace-nowrap text-indigo-300 transition-all">
        ✨ Disney+
      </button>
      <button type="button" onclick="setPlataforma('spotify')" id="plat-spotify" class="plat-pill px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 whitespace-nowrap text-emerald-300 transition-all">
        🎵 Spotify
      </button>
      <button type="button" onclick="setPlataforma('youtube')" id="plat-youtube" class="plat-pill px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 whitespace-nowrap text-red-300 transition-all">
        ▶️ YouTube
      </button>
    </div>

    <!-- Barra de Búsqueda y Dictado por Voz -->
    <form onsubmit="buscarYReproducir(event)" class="relative flex items-center">
      <input 
        id="inputBusqueda" 
        type="search" 
        enterkeyhint="search" 
        autocomplete="off"
        autocorrect="off"
        spellcheck="false"
        placeholder="🔍 Buscar o dictar en SmartTube..." 
        class="w-full bg-[#121727]/90 border border-slate-700/70 focus:border-blue-500 text-slate-100 placeholder-slate-400 text-xs rounded-xl pl-3 pr-12 py-1.5 shadow-inner focus:outline-none focus:ring-1 focus:ring-blue-500 transition-all"
      />
      <button type="submit" class="absolute right-1 px-3 py-1 bg-blue-600 active:bg-blue-700 text-white rounded-lg text-xs font-bold shadow">
        Ir
      </button>
    </form>
  </div>

  <!-- 3. SLIDERS DUALES: RETROILUMINACIÓN & VOLUMEN -->
  <div class="glass-card px-3 py-1.5 rounded-xl space-y-1 flex-shrink-0">
    <div>
      <div class="flex justify-between items-center text-[9px] font-bold tracking-wider mb-0.5">
        <span class="text-sky-400 flex items-center gap-1">☀️ RETROILUMINACIÓN</span>
        <span id="brilloVal" class="font-mono text-sky-300 bg-sky-950/70 px-1.5 py-0.2 rounded border border-sky-800/50 text-[9px]">6%</span>
      </div>
      <input id="sliderBrillo" type="range" min="0" max="100" value="6" oninput="actualizarLabelBrillo(this.value)" onchange="enviarBrillo(this.value)" class="w-full">
    </div>
    <div>
      <div class="flex justify-between items-center text-[9px] font-bold tracking-wider mb-0.5">
        <span class="text-purple-400 flex items-center gap-1">🔊 VOLUMEN</span>
        <span id="volVal" class="font-mono text-purple-300 bg-purple-950/70 px-1.5 py-0.2 rounded border border-purple-800/50 text-[9px]">15%</span>
      </div>
      <input id="sliderVol" type="range" min="0" max="100" value="15" oninput="actualizarLabelVol(this.value)" onchange="enviarVolumen(this.value)" class="w-full slider-vol">
    </div>
  </div>

  <!-- 4. MODOS CIRCADIANOS: DÍA Y NOCHE JUNTOS (ORDEN ESCRUPULOSO) -->
  <div class="grid grid-cols-4 gap-1.5 flex-shrink-0">
    <!-- Noche con Cuenta Atrás Digital en Vivo -->
    <button onclick="enviarAccion('noche')" class="btn-key py-2 px-2.5 rounded-xl bg-gradient-to-r from-indigo-950 via-purple-950 to-slate-900 border border-indigo-400/50 flex items-center justify-between text-left shadow">
      <div class="flex items-center gap-1.5">
        <span class="text-sm">🌙</span>
        <div>
          <div class="text-[11px] font-black text-white leading-tight">Noche</div>
          <div class="text-[8px] text-indigo-300">6% + 90m</div>
        </div>
      </div>
      <span id="timerBadge" onclick="event.stopPropagation(); confirmarCancelarTimer();" class="text-[9px] bg-indigo-500/30 text-indigo-200 px-1.5 py-0.5 rounded-full font-mono font-bold tracking-tight">90m</span>
    </button>

    <!-- Día (100% Brillo) - JUNTOS DIRECTAMENTE -->
    <button onclick="enviarAccion('dia')" title="Modo Día 100%" class="btn-key py-2 rounded-xl text-center border border-amber-500/50 bg-gradient-to-b from-amber-950/40 to-slate-900 shadow">
      <div class="text-sm">☀️</div>
      <div class="text-[9.5px] font-bold text-amber-200">Día</div>
    </button>

    <!-- Cine -->
    <button onclick="enviarAccion('cine')" title="Modo Cine" class="btn-key py-2 rounded-xl text-center border border-slate-700/60 shadow">
      <div class="text-sm">🎬</div>
      <div class="text-[9.5px] font-bold text-slate-200">Cine</div>
    </button>

    <!-- Juego -->
    <button onclick="enviarAccion('juego')" title="Modo Juego" class="btn-key py-2 rounded-xl text-center border border-slate-700/60 shadow">
      <div class="text-sm">🎮</div>
      <div class="text-[9.5px] font-bold text-slate-200">Juego</div>
    </button>
  </div>

  <!-- 5. SECCIÓN CENTRAL CLÁSICA: COLUMNA VOLUMEN + CRUCETA D-PAD GRANDE + COLUMNA CANALES -->
  <div class="flex items-center justify-between gap-2 flex-shrink-0 my-1">
    
    <!-- Rocker Volumen Clásico (Izquierda) -->
    <div class="rocker-box glass-card shadow-lg">
      <button onclick="enviarAccion('vol_up')" title="Volumen +" class="rocker-btn btn-key">
        <span class="text-xl">+</span>
        <span class="text-[8.5px] text-slate-400 font-bold tracking-wider">VOL</span>
      </button>
      <button onclick="enviarAccion('mute')" title="Silenciar" class="rocker-mid-btn btn-key text-amber-400 shadow">
        🔇
      </button>
      <button onclick="enviarAccion('vol_down')" title="Volumen -" class="rocker-btn btn-key">
        <span class="text-[8.5px] text-slate-400 font-bold tracking-wider">VOL</span>
        <span class="text-xl">-</span>
      </button>
    </div>

    <!-- Cruceta D-Pad Circular Ergonómica Grande (Centro) -->
    <div class="dpad-container mx-auto">
      <button onclick="enviarAccion('up')" title="Arriba" class="dpad-arrow dpad-up">▲</button>
      <button onclick="enviarAccion('down')" title="Abajo" class="dpad-arrow dpad-down">▼</button>
      <button onclick="enviarAccion('left')" title="Izquierda" class="dpad-arrow dpad-left">◄</button>
      <button onclick="enviarAccion('right')" title="Derecha" class="dpad-arrow dpad-right">►</button>
      <button onclick="enviarAccion('enter')" title="Aceptar (OK)" class="dpad-center">OK</button>
    </div>

    <!-- Rocker Canales & Entradas Clásico (Derecha) -->
    <div class="rocker-box glass-card shadow-lg">
      <button onclick="enviarAccion('ch_up')" title="Canal +" class="rocker-btn btn-key">
        <span class="text-xl">+</span>
        <span class="text-[8.5px] text-slate-400 font-bold tracking-wider">CH</span>
      </button>
      <button onclick="enviarAccion('source')" title="Entrada / HDMI" class="rocker-mid-btn btn-key text-sky-400 text-[10px] font-black shadow">
        HDMI
      </button>
      <button onclick="enviarAccion('ch_down')" title="Canal -" class="rocker-btn btn-key">
        <span class="text-[8.5px] text-slate-400 font-bold tracking-wider">CH</span>
        <span class="text-xl">-</span>
      </button>
    </div>
  </div>

  <!-- 6. TECLAS DE NAVEGACIÓN Y REPRODUCCIÓN MULTIMEDIA (Grandes y Cómodas) -->
  <div class="grid grid-cols-5 gap-2 flex-shrink-0">
    <button onclick="enviarAccion('back')" title="Atrás" class="btn-key h-12 rounded-2xl flex items-center justify-center text-slate-100 font-black text-lg shadow">
      <span>↩</span>
    </button>
    <button onclick="enviarAccion('rewind')" title="Rebobinar -10s" class="btn-key h-12 rounded-2xl flex items-center justify-center text-slate-100 font-black text-lg shadow">
      <span>⏪</span>
    </button>
    <button onclick="enviarAccion('play_pause')" title="Play / Pausa" class="btn-key h-12 rounded-2xl text-white bg-gradient-to-b from-indigo-600 to-indigo-800 border border-indigo-400/60 flex items-center justify-center text-xl shadow-lg">
      ⏯️
    </button>
    <button onclick="enviarAccion('fast_forward')" title="Avanzar +10s" class="btn-key h-12 rounded-2xl flex items-center justify-center text-slate-100 font-black text-lg shadow">
      <span>⏩</span>
    </button>
    <button onclick="enviarAccion('home')" title="Inicio" class="btn-key h-12 rounded-2xl flex items-center justify-center text-slate-100 font-black text-lg shadow">
      <span>🏠</span>
    </button>
  </div>

  <!-- 7. TECLAS DE SISTEMA Y CONTROL DE LA BARRA SHARP -->
  <div class="grid grid-cols-5 gap-2 flex-shrink-0">
    <button onclick="enviarAccion('settings')" title="Ajustes" class="btn-key h-11 rounded-2xl flex flex-col items-center justify-center text-slate-300 font-bold text-[9px] shadow">
      <span class="text-sm">⚙️</span>
      <span>Ajustes</span>
    </button>
    <button onclick="enviarAccion('info')" title="Información" class="btn-key h-11 rounded-2xl flex flex-col items-center justify-center text-slate-300 font-bold text-[9px] shadow">
      <span class="text-sm">ℹ️</span>
      <span>Info</span>
    </button>
    <!-- BOTÓN DE CONMUTACIÓN BARRA SHARP (HDMI ARC) / TV SPEAKER -->
    <button id="btnAudioSharp" onclick="conmutarSalidaAudio()" title="Barra de Sonido Sharp (HDMI ARC)" class="btn-key h-11 rounded-2xl bg-gradient-to-b from-sky-950 via-slate-900 to-slate-900 border border-sky-400/50 flex flex-col items-center justify-center text-sky-300 font-black text-[8.5px] shadow">
      <span class="text-sm">📢</span>
      <span id="lblAudioOut">Barra Sharp</span>
    </button>
    <button onclick="setPlataforma('smarttube'); buscarYReproducir(event);" title="SmartTube" class="btn-key h-11 rounded-2xl bg-gradient-to-r from-red-950/80 to-slate-900 border border-red-700/60 text-red-200 font-bold text-[9px] flex flex-col items-center justify-center shadow">
      <span class="text-sm">📺</span>
      <span>SmartTube</span>
    </button>
    <button onclick="enviarAccion('solo_audio')" title="Solo Audio (Pantalla Off)" class="btn-key h-11 rounded-2xl bg-gradient-to-r from-amber-950/60 to-slate-900 border border-amber-600/40 text-amber-200 font-bold text-[9px] flex flex-col items-center justify-center shadow">
      <span class="text-sm">📻</span>
      <span>Solo Audio</span>
    </button>
  </div>

  <!-- 8. FOOTER: ESTADO EN VIVO & LINK DIRECTO AL HUB DE SIRI -->
  <div class="flex items-center justify-between text-[10px] text-slate-400 px-1 border-t border-white/5 pt-1 flex-shrink-0">
    <div class="flex items-center gap-1.5">
      <span id="statusIndicator" class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="statusTxt" class="font-mono text-slate-300 truncate max-w-[200px]">Conectado</span>
    </div>
    <a href="/siri" class="flex items-center gap-1 text-[10px] font-bold text-sky-300 bg-sky-950/60 px-2.5 py-1 rounded-xl border border-sky-700/50 active:scale-95 transition-all shadow">
      <span>🎙️</span> <span>Siri Atajos</span>
    </a>
  </div>

</div>

<script>
  let dispositivoActual = 'xiaomi';
  let plataformaActual = 'smarttube';
  let audioEsSharp = true;

  const placeholders = {
    'smarttube': '🔍 Buscar o dictar en SmartTube...',
    'youtube': '▶️ Buscar vídeo en YouTube...',
    'netflix': '🍿 Buscar serie o peli en Netflix...',
    'prime': '📦 Buscar en Prime Video...',
    'disney': '✨ Buscar en Disney+...',
    'spotify': '🎵 Buscar canción o playlist en Spotify...'
  };

  function vibrar() {
    if (navigator.vibrate) {
      navigator.vibrate(25);
    }
    // Ráfaga Web Audio (Taptic Engine emulation en iOS Safari)
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(80, ctx.currentTime);
      gain.gain.setValueAtTime(0.08, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.04);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.04);
    } catch(e) {}
  }

  function setDispositivo(target) {
    vibrar();
    dispositivoActual = target;
    ['xiaomi', 'lg', 'ambas'].forEach(t => {
      const el = document.getElementById('tab-' + t);
      if (t === target) {
        el.className = 'flex-1 py-1.5 text-[11px] font-bold rounded-lg transition-all active-pill';
      } else {
        el.className = 'flex-1 py-1.5 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition-all';
      }
    });
    actualizarStatus('Controlando: ' + (target === 'ambas' ? 'Ambas Televisiones' : target.toUpperCase()));
  }

  function setPlataforma(plat) {
    vibrar();
    plataformaActual = plat;
    const plats = ['smarttube', 'netflix', 'prime', 'disney', 'spotify', 'youtube'];
    plats.forEach(p => {
      const btn = document.getElementById('plat-' + p);
      if (btn) {
        if (p === plat) {
          btn.className = 'active-plat px-2.5 py-1 rounded-xl text-[10px] font-extrabold flex items-center gap-1 whitespace-nowrap transition-all shadow';
        } else {
          btn.className = 'plat-pill px-2.5 py-1 rounded-xl text-[10px] font-bold flex items-center gap-1 whitespace-nowrap text-slate-400 hover:text-slate-200 transition-all';
        }
      }
    });
    const inp = document.getElementById('inputBusqueda');
    if (inp) {
      inp.placeholder = placeholders[plat] || '🔍 Buscar...';
      inp.value = '';
    }
  }

  async function buscarYReproducir(e) {
    if (e) e.preventDefault();
    vibrar();
    const query = document.getElementById('inputBusqueda').value.trim();
    actualizarStatus('▶ Enviando ' + plataformaActual.toUpperCase() + (query ? ': ' + query : '...'));

    try {
      const url = '/api/voice?q=' + encodeURIComponent(query) + '&platform=' + encodeURIComponent(plataformaActual) + '&target=' + encodeURIComponent(dispositivoActual);
      const res = await fetch(url);
      const data = await res.json();
      actualizarStatus(data.mensaje || 'Lanzado con éxito');
    } catch(err) {
      actualizarStatus('Error conectando');
    }
  }

  async function enviarAccion(cmd, val = '0') {
    vibrar();
    try {
      const url = '/api/action?cmd=' + encodeURIComponent(cmd) + '&target=' + encodeURIComponent(dispositivoActual) + '&val=' + encodeURIComponent(val);
      const res = await fetch(url);
      const data = await res.json();
      if (data.ok && data.mensaje) {
        actualizarStatus(data.mensaje);
      }
    } catch(e) {
      actualizarStatus('Error de red');
    }
  }

  function conmutarSalidaAudio() {
    vibrar();
    audioEsSharp = !audioEsSharp;
    const cmd = audioEsSharp ? 'audio_sharp' : 'audio_tv';
    const label = audioEsSharp ? 'Barra Sharp' : 'Altavoz TV';
    document.getElementById('lblAudioOut').textContent = label;
    enviarAccion(cmd);
    actualizarStatus(audioEsSharp ? '📢 Audio: Barra Sharp (HDMI ARC)' : '📺 Audio: Altavoz TV');
  }

  function actualizarLabelBrillo(v) {
    document.getElementById('brilloVal').textContent = v + '%';
  }
  function enviarBrillo(v) {
    enviarAccion('set_brillo', v);
  }

  function actualizarLabelVol(v) {
    document.getElementById('volVal').textContent = v + '%';
  }
  function enviarVolumen(v) {
    enviarAccion('set_volumen', v);
  }

  function solicitarEncendido() {
    vibrar();
    enviarAccion('encender');
    actualizarStatus('⚡ Encendiendo TV (' + dispositivoActual.toUpperCase() + ')...');
  }

  function solicitarApagado() {
    vibrar();
    if (confirm('¿Poner en Standby / Apagar ' + dispositivoActual.toUpperCase() + '?')) {
      enviarAccion('apagar');
      actualizarStatus('🔌 Apagando...');
    }
  }

  function confirmarCancelarTimer() {
    vibrar();
    if (confirm('¿Cancelar temporizador de apagado de 90m?')) {
      enviarAccion('cancelar_timer');
    }
  }

  async function sincronizarEstadoServidor() {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      
      const badge = document.getElementById('timerBadge');
      let minRest = 0;
      if (dispositivoActual === 'lg') minRest = data.timer_lg;
      else if (dispositivoActual === 'xiaomi') minRest = data.timer_xiaomi;
      else minRest = Math.max(data.timer_lg, data.timer_xiaomi);

      if (minRest > 0) {
        badge.textContent = minRest + 'm';
        badge.classList.remove('hidden');
      } else {
        badge.textContent = '90m';
      }
    } catch(e) {}
  }

  setInterval(sincronizarEstadoServidor, 5000);
  sincronizarEstadoServidor();

  function actualizarStatus(txt) {
    document.getElementById('statusTxt').textContent = txt;
  }
</script>
</body>
</html>
